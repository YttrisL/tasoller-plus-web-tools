<!-- ============================ TEST ============================ -->
<section id="page-test" class="page" aria-label="Input test">
  <div id="testNotice" class="banner warn" hidden></div>
  <div class="test-scroll">
    <div class="test-layout">
      <div>
        <div class="air-title">Air</div>
        <div class="air-rows" id="airRows"></div>
        <div class="grids">
          <div class="sgrid" id="gridTop"></div>
          <div class="sgrid" id="gridBottom"></div>
        </div>
      </div>
      <div class="fn-col">
        <div class="fn"><span id="fnLabel1">fn1</span><div class="fn-btn" id="fn1"><span id="fnKey1"></span></div></div>
        <div class="fn"><span id="fnLabel2">fn2</span><div class="fn-btn" id="fn2"><span id="fnKey2"></span></div></div>
      </div>
    </div>
  </div>
  <div class="test-foot">
    <span id="streamInfo">Live data: not started</span>
    <span id="legend">Big number: sensor value sent to the game (0-255). Small number: DIFF (sum of the 4 pads). Circles: the 4 thresholds of the sensor (yellow = customised).</span>
    <span>Click a sensor to edit its thresholds.</span>
  </div>
</section>
